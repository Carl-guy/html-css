<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin-top: 50px;
        }


        div > p {
            display: none;
        }
        div:hover > p {
            display: block;
            background-color: rgb(255, 4, 4);
            color: rgb(255, 255, 255);
            width: 200px;
        }
        div:hover {
            color: rgb(255, 28, 28);
           
        }
    </style>
</head>
<body>
        <h1>Exemplo de Hover</h1>
        <p>Passe o mouse sobre o texto abaixo para ver o efeito de hover:</p>

        <div>
            Passar o mouse sobre mim
            <p>TEXTO ESCONDIDO!</p>
        </div>

        <p>Fim do exemplo.</p>
</body>
</html>
