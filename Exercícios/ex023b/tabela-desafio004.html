<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    


    <style>
         body{
            font-family: Arial, Helvetica, sans-serif;
            
        }

        caption{

            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }

        table{

            border-collapse: collapse;
        }


        th, td{

            border: 1px solid black;
            padding: 10px;
        }

        th{
            background-color: gray;
            color: white;
        }
       
    </style>
</head>
<body>

        <h1>Exercício de Tabela</h1>
    <table>
        <caption>Media de notas</caption>
    
        <thead>

            <tr>
                <th colspan="2" scope="col">Área</th>
                <th colspan="2" scope="col">Disciplinas</th>
                <th scope="colgroup">Notas</th>
                
                <th colspan="2"> Média</th>
            </tr>

        </thead>
        <tbody>
            
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>


            <tr>
                <td rowspan="4">Exatas</td>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

             <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

             <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            
            <tr>
                <th colspan="4">Média de Exatas</th>
                <td>0.0</td>
            </tr>


            <tr>
                <td rowspan="4">Humanas</td>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tfoot>
                <th colspan="4">Média de Humanas</th>
                <td>0.0</td>
            </tfoot>

        </tbody>
    
    </table>
    


</body>
</html>
