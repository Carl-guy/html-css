<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 {
            background-color: #f2f2f2;
            padding: 10px;
            height: 200px;
            width: 200px;
            border: 10px solid #998eff;
            margin: auto;
            outline: #162ba1 dashed 5px;
        }
        p {
            background-color: #e6e6e6;
            padding: 10px;
            border: 1px solid #ccc;
        }
        a {
            border: 5px solid #a11616;
            color: blue;
            text-decoration: none;
        }
    </style>
</head>
<body>
        <h1>Exemplo de Caixas box level</h1>
        <P>parágrafos também são caixas box level, mas os <a href="#">links</a> são exemplos de caixas inline level. Vamos ver como tudo isso funciona.</P>
</body>
</html>
